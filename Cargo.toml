[package]
name = "serikapay"
version = "1.0.0"
edition = "2021"
description = "Official SerikaPay library for Rust"
license = "MIT"
repository = "https://github.com/serika-dev/serikapay-rust"
homepage = "https://wallet.serika.dev/developers"
documentation = "https://docs.rs/serikapay"
readme = "README.md"
keywords = ["serikapay", "payments", "api", "sdk"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.13"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
