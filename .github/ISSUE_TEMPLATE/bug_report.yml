name: Bug report
description: Something in the library doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal code to reproduce
      description: Leave out your API key and any customer data.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Library version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Rust version and OS
    validations:
      required: true
